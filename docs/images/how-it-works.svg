<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="How it works: record in Edge, analyze the recording, ask about credentials and folders, generate the bot, run it on a schedule">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="20" fill="#0d1117"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="58" font-size="26" font-weight="700" fill="#f0f6fc">How it works</text>
    <text x="48" y="88" font-size="16" fill="#8b949e">One recording becomes a bot you can run every day without opening the browser.</text>

    <!-- cartões -->
    <g font-size="15" fill="#c9d1d9">
      <g transform="translate(48 120)">
        <rect width="208" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="30" cy="32" r="15" fill="#1f6feb"/><text x="30" y="37.5" text-anchor="middle" font-weight="700" fill="#fff">1</text>
        <text x="56" y="38" font-size="19" font-weight="700" fill="#f0f6fc">Record</text>
        <text x="20" y="82">Edge opens empty.</text>
        <text x="20" y="104">You do the task once</text>
        <text x="20" y="126">and close the window.</text>
        <text x="20" y="152" font-size="13" fill="#8b949e">Playwright codegen</text>
      </g>
      <g transform="translate(290 120)">
        <rect width="208" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="30" cy="32" r="15" fill="#1f6feb"/><text x="30" y="37.5" text-anchor="middle" font-weight="700" fill="#fff">2</text>
        <text x="56" y="38" font-size="19" font-weight="700" fill="#f0f6fc">Analyze</text>
        <text x="20" y="82">Reads the recorded</text>
        <text x="20" y="104">steps, typed fields,</text>
        <text x="20" y="126">downloads and reloads.</text>
        <text x="20" y="152" font-size="13" fill="#8b949e">Python ast</text>
      </g>
      <g transform="translate(532 120)">
        <rect width="208" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="30" cy="32" r="15" fill="#1f6feb"/><text x="30" y="37.5" text-anchor="middle" font-weight="700" fill="#fff">3</text>
        <text x="56" y="38" font-size="19" font-weight="700" fill="#f0f6fc">Ask</text>
        <text x="20" y="82">Which fields are</text>
        <text x="20" y="104">credentials? Where</text>
        <text x="20" y="126">should each file go?</text>
        <text x="20" y="152" font-size="13" fill="#8b949e">terminal + folder picker</text>
      </g>
      <g transform="translate(774 120)">
        <rect width="208" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="30" cy="32" r="15" fill="#1f6feb"/><text x="30" y="37.5" text-anchor="middle" font-weight="700" fill="#fff">4</text>
        <text x="56" y="38" font-size="19" font-weight="700" fill="#f0f6fc">Generate</text>
        <text x="20" y="82">Writes one Python</text>
        <text x="20" y="104">file with network</text>
        <text x="20" y="126">waits and safe logs.</text>
        <text x="20" y="152" font-size="13" fill="#8b949e">compile() checked</text>
      </g>
      <g transform="translate(1016 120)">
        <rect width="216" height="170" rx="14" fill="#161b22" stroke="#3fb950"/>
        <circle cx="30" cy="32" r="15" fill="#238636"/><text x="30" y="37.5" text-anchor="middle" font-weight="700" fill="#fff">5</text>
        <text x="56" y="38" font-size="19" font-weight="700" fill="#f0f6fc">Run</text>
        <text x="20" y="82">By hand, or from</text>
        <text x="20" y="104">Task Scheduler</text>
        <text x="20" y="126">without a window.</text>
        <text x="20" y="152" font-size="13" fill="#8b949e">--headless</text>
      </g>
    </g>

    <!-- setas entre os cartões -->
    <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#seta)">
      <path d="M260 205 h24"/>
      <path d="M502 205 h24"/>
      <path d="M744 205 h24"/>
      <path d="M986 205 h24"/>
    </g>

    <!-- o que sai de cada etapa -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 5" fill="none">
      <path d="M636 290 v42"/>
      <path d="M878 290 v42"/>
      <path d="M1124 290 v42"/>
    </g>
    <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="14">
      <rect x="532" y="336" width="208" height="64" rx="10" fill="#0d1117" stroke="#d29922"/>
      <text x="548" y="362" fill="#e3b341">.env</text>
      <text x="548" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">credentials, not in code</text>

      <rect x="774" y="336" width="208" height="64" rx="10" fill="#0d1117" stroke="#58a6ff"/>
      <text x="790" y="362" fill="#79c0ff">bots/&lt;name&gt;.py</text>
      <text x="790" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">readable and editable</text>

      <rect x="1016" y="336" width="216" height="64" rx="10" fill="#0d1117" stroke="#3fb950"/>
      <text x="1032" y="362" fill="#7ee787">your folder + logs/</text>
      <text x="1032" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">file + screenshot on error</text>
    </g>
  </g>
</svg>
