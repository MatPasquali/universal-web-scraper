<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Universal Web Scraper: teach a browser task once and get a Python bot that repeats it">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#12395a"/>
    </linearGradient>
    <linearGradient id="traco" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="pontos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#fundo)"/>
  <rect width="1280" height="360" rx="20" fill="url(#pontos)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="140" font-size="62" font-weight="700" fill="#f0f6fc">Universal Web Scraper</text>
    <text x="80" y="192" font-size="25" fill="#c9d1d9">Teach a browser task once. Get a Python bot that repeats it.</text>
    <rect x="80" y="218" width="132" height="5" rx="2.5" fill="url(#traco)"/>

    <g font-size="17" font-weight="600" text-anchor="middle">
      <rect x="80" y="252" width="172" height="40" rx="20" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.6"/>
      <text x="166" y="278" fill="#cae0ff">Record in Edge</text>
      <path d="M262 272 h22 m-7 -6 l7 6 l-7 6" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="294" y="252" width="216" height="40" rx="20" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.6"/>
      <text x="402" y="278" fill="#cae0ff">Standalone Python bot</text>
      <path d="M520 272 h22 m-7 -6 l7 6 l-7 6" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="552" y="252" width="190" height="40" rx="20" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="647" y="278" fill="#c6f3d0">Scheduled runs</text>
    </g>
  </g>

  <!-- janela do navegador -->
  <g transform="translate(880 70)">
    <rect width="300" height="200" rx="12" fill="#f3f5f8"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h276 a12 12 0 0 1 12 12 v22 h-300z" fill="#1f4e79"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="17" r="5" fill="#27c93f"/>
    <rect x="24" y="56" width="120" height="10" rx="5" fill="#9aa8b6"/>
    <rect x="24" y="78" width="252" height="26" rx="6" fill="#ffffff" stroke="#d8dee6"/>
    <rect x="24" y="114" width="252" height="26" rx="6" fill="#ffffff" stroke="#d8dee6"/>
    <rect x="24" y="152" width="96" height="28" rx="6" fill="#1f4e79"/>
    <!-- cursor -->
    <path d="M100 160 l0 30 l8 -7 l6 13 l6 -3 l-6 -12 l10 -1 z" fill="#0b1622" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- seta para o bot -->
  <path d="M1030 286 v26 m-7 -8 l7 8 l7 -8" stroke="#58a6ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(962 318)">
    <rect width="136" height="30" rx="8" fill="#0d1117" stroke="#3fb950"/>
    <text x="68" y="21" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#7ee787">bots/task.py</text>
  </g>
</svg>
