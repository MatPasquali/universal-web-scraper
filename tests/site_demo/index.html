<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Sistema de Uso - Login</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="topo"><strong>Sistema de Uso</strong><span>ambiente de demonstração</span></div>
  <main>
    <div class="cartao login">
      <h1>Entrar</h1>
      <form id="login">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" autocomplete="off">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password">
        <button class="primario" type="submit">Entrar</button>
        <p id="erro" role="alert"></p>
      </form>
    </div>
  </main>
  <script>
    // ?bloqueado=1 deixa a senha somente leitura: o fill da senha falha (teste de vazamento no log).
    if (new URLSearchParams(location.search).has("bloqueado")) {
      document.getElementById("senha").readOnly = true;
    }

    document.getElementById("login").addEventListener("submit", (evento) => {
      evento.preventDefault();
      const usuario = document.getElementById("usuario").value;
      const senha = document.getElementById("senha").value;
      if (usuario === "demo" && senha === "demo123") {
        location.href = "painel.html";
      } else {
        document.getElementById("erro").textContent = "Usuário ou senha inválidos";
      }
    });
  </script>
</body>
</html>
