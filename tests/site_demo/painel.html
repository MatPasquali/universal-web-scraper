<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Cotações - Painel</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="topo"><strong>Sistema de Cotações</strong><span>usuário: demo</span></div>
  <main>
    <div class="cartao">
      <h1>Painel de cotações</h1>
      <div class="barra">
        <label for="local">Local</label>
        <select id="local">
          <option>Todos</option>
          <option>SP</option>
          <option>RJ</option>
        </select>
        <button id="filtrar" type="button">Filtrar</button>
        <!-- Janela de escolha que chama o painel e se fecha sozinha (padrão "lupa" de sistemas legados). -->
        <button id="escolher" type="button">Escolher local</button>
        <!-- Busca enquanto digita, sem botão: não há clique depois do qual esperar. -->
        <input id="busca" placeholder="Buscar produto" autocomplete="off">
      </div>
      <div class="barra">
        <span class="espaco"></span>
        <!-- De propósito os botões nunca ficam desabilitados: exportam o que estiver na tela. -->
        <button class="primario" id="exportar" type="button">Exportar CSV</button>
        <!-- Download que nasce numa janela nova, gerado pelo servidor. -->
        <button id="exportar-janela" type="button">Exportar em nova janela</button>
      </div>
      <table>
        <thead><tr><th>Local</th><th>Produto</th><th>Prêmio</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
      <p id="status" role="status">Carregando...</p>
    </div>
  </main>
  <script>
    let dados = [];
    let busca = "";
    let temporizador = null;

    function filtros() {
      return new URLSearchParams({ local: document.getElementById("local").value, produto: busca });
    }

    function reais(valor) {
      return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function mostrar() {
      document.getElementById("linhas").innerHTML = dados
        .map((d) => `<tr><td>${d.local}</td><td>${d.produto}</td><td>${reais(d.premio)}</td></tr>`)
        .join("");
      document.getElementById("status").textContent = dados.length + " cotações";
    }

    async function carregar(local) {
      document.getElementById("local").value = local;
      document.getElementById("status").textContent = "Carregando...";
      const resposta = await fetch("/api/cotacoes?" + filtros());
      dados = await resposta.json();
      mostrar();
    }

    document.getElementById("filtrar").addEventListener("click", () => {
      carregar(document.getElementById("local").value);
    });

    document.getElementById("escolher").addEventListener("click", () => {
      window.open("lupa.html", "lupa", "width=320,height=240");
    });

    document.getElementById("busca").addEventListener("input", (evento) => {
      busca = evento.target.value;
      clearTimeout(temporizador);
      temporizador = setTimeout(() => carregar(document.getElementById("local").value), 300);
    });

    document.getElementById("exportar").addEventListener("click", () => {
      if (!confirm("Exportar a base filtrada?")) return;
      const linhas = ["local;produto;premio", ...dados.map((d) => [d.local, d.produto, d.premio].join(";"))];
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([linhas.join("\n")], { type: "text/csv" }));
      link.download = "cotacoes.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    document.getElementById("exportar-janela").addEventListener("click", () => {
      window.open("/api/export.csv?" + filtros());
    });

    carregar("Todos");
  </script>
</body>
</html>
